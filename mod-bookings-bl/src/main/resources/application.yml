spring:
  cloud:
    openfeign:
      okhttp:
        enabled: true
  application:
    name: mod-bookings-bl

server:
  port: ${SERVER_PORT:8082}

okapi:
  url: ${OKAPI_URL:http://okapi:9130}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: basic

logging:
  level:
    org.folio: INFO
    org.springframework: WARN
